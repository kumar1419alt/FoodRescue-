services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foodrescue_dev
      POSTGRES_USER: foodrescue
      # Required from the local environment; never commit its value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally before starting Docker Compose}
    ports:
      - "5432:5432"
    volumes:
      - foodrescue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrescue -d foodrescue_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodrescue_postgres_data:
